name: Release

# Pushing a version tag (v0.1.0b1, v0.1.0) builds and publishes the GitHub release.
# Releases are never made by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check version and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches manifest, library and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          domain=$(basename custom_components/*/)
          echo "$version" | grep -Eq '^0\.[0-9]+\.[0-9]+(b[0-9]+)?$' || { echo "$TAG isn't a version tag"; exit 1; }
          manifest=$(jq -r .version "custom_components/$domain/manifest.json")
          test "$manifest" = "$version" || { echo "manifest.json is $manifest, tag is $version"; exit 1; }
          for init in custom_components/"$domain"/*/__init__.py; do
            [ -f "$init" ] || continue
            library=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "$init")
            [ -z "$library" ] || test "$library" = "$version" || { echo "$init is $library, tag is $version"; exit 1; }
          done
          grep -q "^## $version (" CHANGELOG.md || { echo "CHANGELOG.md has no $version entry"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install uv
      - run: uv pip install --system pytest-homeassistant-custom-component -r requirements_test.txt
      - run: pytest -q

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Zip the integration
        run: |
          domain=$(basename custom_components/*/)
          cd "custom_components/$domain" && zip -r "../../$domain.zip" . -x '__pycache__/*' '*/__pycache__/*'
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.zip"
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## " v " (") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No changelog section for $version"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *b*) prerelease="--prerelease" ;; esac
          domain=$(basename custom_components/*/)
          gh release create "$TAG" "$domain.zip" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "${TAG#v}" --notes-file notes.md $prerelease
